events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 25m;

    upstream backend_api {
        server backend:8000;
    }

    upstream dashboard_app {
        server dashboard:3000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers (global) — Mini App must stay frameable by Telegram
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Prefer upstream TLS terminator (Caddy) proto when present
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # FastAPI — preserve cookies for admin JWT
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            # Trustworthy client IP for auth rate-limit (_client_ip uses X-Real-IP)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options DENY always;
        }

        # Health (also available via /api if mounted; direct backend path)
        location = /health {
            proxy_pass http://backend_api/health;
        }

        # WebSocket
        location /ws {
            proxy_pass http://backend_api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400;
        }

        # Telegram Mini App — must be embeddable (no X-Frame-Options DENY)
        location /miniapp {
            proxy_pass http://dashboard_app;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # Allow Telegram WebView embedding
            add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org https://*.telegram.org;" always;
        }

        # Next.js Dashboard + Login (deny framing)
        location / {
            proxy_pass http://dashboard_app;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options DENY always;
        }
    }
}
