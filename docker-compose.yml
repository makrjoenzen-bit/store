version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jit_postgres
    restart: always
    environment:
      POSTGRES_DB: aggregator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jit_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: jit_backend
    restart: always
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build: .
    container_name: jit_telegram_bot
    restart: always
    command: ["python", "-m", "src.bot.bot_main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  admin-bot:
    build: .
    container_name: jit_admin_control_bot
    restart: always
    command: ["python", "-m", "src.admin_bot.bot_main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  worker-jit:
    build: .
    container_name: jit_worker_execution
    restart: always
    command: ["arq", "src.workers.jit_worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  worker-bsc:
    build: .
    container_name: jit_worker_bsc_listener
    restart: always
    command: ["python", "-m", "src.workers.bsc_listener"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  worker-tron:
    build: .
    container_name: jit_worker_tron_listener
    restart: always
    command: ["python", "-m", "src.workers.tron_listener"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  worker-binance-pay:
    build: .
    container_name: jit_worker_binance_pay_listener
    restart: always
    command: ["python", "-m", "src.workers.binance_pay_listener"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  worker-health:
    build: .
    container_name: jit_worker_health_monitor
    restart: always
    command: ["python", "-m", "src.workers.health_monitor"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  worker-channel:
    build: .
    container_name: jit_worker_channel_sync
    restart: always
    command: ["python", "-m", "src.workers.channel_sync"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: jit_admin_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Server-side rewrite target only — browsers always use relative /api and /ws via Nginx
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: jit_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - dashboard

  worker-radar:
    build: .
    container_name: jit_worker_competitor_radar
    restart: always
    command: ["python", "-m", "src.workers.radar_worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aggregator_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  # Optional BI — start with: docker compose --profile bi up -d
  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.50.25
    container_name: jit_metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ENCRYPTION_SECRET_KEY: "phase17_bi_change_me_in_prod_32chars"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  metabase_data:
