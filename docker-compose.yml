version: "3.9"

x-app-db: &app-db-env
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-change_me_db_password}@postgres:5432/aggregator_db
  REDIS_URL: redis://redis:6379/0

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jit_postgres
    restart: always
    environment:
      POSTGRES_DB: aggregator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host ports — internal Docker network only
    mem_limit: 512m
    logging: *json-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jit_redis
    restart: always
    # noeviction — never drop locks / TxDeduper / ARQ keys under memory pressure
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    # No host ports — internal Docker network only
    mem_limit: 256m
    logging: *json-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: jit_backend
    restart: always
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host ports — reach via nginx/Caddy on :80 only (Docker network: backend:8000)
    mem_limit: 512m
    logging: *json-logging

  bot:
    build: .
    container_name: jit_telegram_bot
    restart: always
    command: ["python", "-m", "src.bot.bot_main"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    mem_limit: 256m
    logging: *json-logging

  admin-bot:
    build: .
    container_name: jit_admin_control_bot
    restart: always
    command: ["python", "-m", "src.admin_bot.bot_main"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    mem_limit: 256m
    logging: *json-logging

  worker-jit:
    build: .
    container_name: jit_worker_execution
    restart: always
    command: ["arq", "src.workers.jit_worker.WorkerSettings"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 384m
    logging: *json-logging

  worker-bsc:
    build: .
    container_name: jit_worker_bsc_listener
    restart: always
    command: ["python", "-m", "src.workers.bsc_listener"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 192m
    logging: *json-logging

  worker-tron:
    build: .
    container_name: jit_worker_tron_listener
    restart: always
    command: ["python", "-m", "src.workers.tron_listener"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 192m
    logging: *json-logging

  worker-binance-pay:
    build: .
    container_name: jit_worker_binance_pay_listener
    restart: always
    command: ["python", "-m", "src.workers.binance_pay_listener"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 192m
    logging: *json-logging

  worker-health:
    build: .
    container_name: jit_worker_health_monitor
    restart: always
    command: ["python", "-m", "src.workers.health_monitor"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 192m
    logging: *json-logging

  worker-channel:
    build: .
    container_name: jit_worker_channel_sync
    restart: always
    command: ["python", "-m", "src.workers.channel_sync"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 192m
    logging: *json-logging

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: jit_admin_dashboard
    restart: always
    # No host ports — reach via nginx/Caddy on :80 only (Docker network: dashboard:3000)
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    mem_limit: 384m
    logging: *json-logging

  nginx:
    image: nginx:alpine
    container_name: jit_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - dashboard
    mem_limit: 64m
    logging: *json-logging

  # Optional — start with: docker compose --profile extras up -d
  worker-radar:
    profiles: ["extras"]
    build: .
    container_name: jit_worker_competitor_radar
    restart: always
    command: ["python", "-m", "src.workers.radar_worker"]
    env_file: .env
    environment:
      <<: *app-db-env
    depends_on:
      backend:
        condition: service_started
    mem_limit: 256m
    logging: *json-logging

  # Optional BI — start with: docker compose --profile bi up -d
  metabase:
    profiles: ["bi"]
    image: metabase/metabase:v0.50.25
    container_name: jit_metabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:-change_me_metabase_encryption_32chars}
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    logging: *json-logging

volumes:
  postgres_data:
  redis_data:
  metabase_data:
